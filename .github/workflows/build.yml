name: Build mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        id: build
        with:
          # use the Geode version written in mod.json so the two always match
          sdk: given
          # Geode's newest bindings no longer build with SDK 5.11.2, so use the
          # bindings from the day 5.11.2 was released and build their codegen
          # from source so the two match.
          bindings: geode-sdk/bindings
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - uses: actions/upload-artifact@v4
        with:
          name: trajectory-assist
          path: ${{ steps.build.outputs.build-output }}
