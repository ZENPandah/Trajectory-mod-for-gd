name: Build mod

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: geode-sdk/build-geode-mod@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: trajectory-assist
          path: ${{ steps.build.outputs.build-output }}
